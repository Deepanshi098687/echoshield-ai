<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#04070f" />
      <stop offset="45%" stop-color="#04060d" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
    <radialGradient id="cyanGlow" cx="28%" cy="18%" r="35%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="redGlow" cx="82%" cy="12%" r="20%">
      <stop offset="0%" stop-color="#ff005d" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ff005d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="magentaGlow" cx="20%" cy="80%" r="25%">
      <stop offset="0%" stop-color="#ff00d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff00d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="160" height="160" patternUnits="userSpaceOnUse" patternTransform="translate(0,0)">
      <path d="M160 0H0V160" fill="none" stroke="#00f5ff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="4" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncR type="linear" slope="0.07"/>
        <feFuncG type="linear" slope="0.07"/>
        <feFuncB type="linear" slope="0.07"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bgGrad)" />
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.35" />
  <rect width="1920" height="1080" fill="url(#noise)" opacity="0.08" />
  <circle cx="540" cy="220" r="240" fill="url(#cyanGlow)" />
  <circle cx="1660" cy="150" r="160" fill="url(#redGlow)" />
  <circle cx="420" cy="860" r="220" fill="url(#magentaGlow)" />
  <g stroke="#00f5ff" stroke-opacity="0.16" stroke-width="1.2">
    <path d="M0 700 H1920" />
    <path d="M0 820 H1920" />
    <path d="M0 940 H1920" />
    <path d="M800 0 V1080" />
    <path d="M960 0 V1080" />
  </g>
  <g fill="none" stroke="#ff0077" stroke-opacity="0.18" stroke-width="1.2">
    <path d="M1380 950 C1460 820, 1700 780, 1860 700" />
    <path d="M1520 940 C1570 840, 1800 780, 1920 700" />
  </g>
  <g opacity="0.4" stroke="#00f5ff" stroke-width="1">
    <path d="M110 320 L360 320" />
    <path d="M110 345 L360 345" />
    <path d="M110 370 L360 370" />
  </g>
</svg>
